server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/portal;
    index index.html;

    # SPA fallback — send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest and service worker — no cache
    location ~* (manifest\.webmanifest|sw\.js)$ {
        expires off;
        add_header Cache-Control "no-store";
    }
}
