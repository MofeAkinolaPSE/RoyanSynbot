# Security headers for every response. nginx drops server-level add_header lines in any location that sets its
# own add_header (e.g. Cache-Control), so each such location includes this file too - before Oct 2026 the app's
# pages went out with none of them.
add_header X-Content-Type-Options   "nosniff"       always;
add_header X-Frame-Options          "SAMEORIGIN"    always;
add_header X-XSS-Protection         "1; mode=block" always;
add_header Referrer-Policy          "strict-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
