worker_processes auto;

events {
    worker_connections 1024;
}

http {

    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    # Docker's embedded DNS — resolves service names at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        # HSTS on the redirect itself too — defense-in-depth in case a client
        # doesn't follow the redirect (the 443 block below sets the full set).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Let's Encrypt HTTP-01 challenge — must be served over plain HTTP, so
        # this has to win over the redirect below. Used by scripts/issue-cert.sh
        # and scripts/renew-cert.sh once a real domain points at this server.
        # NOTE: the redirect below must live inside `location / { }`, not as a
        # bare server-level `return` — a bare return runs in nginx's
        # server-rewrite phase, which happens BEFORE location matching, so it
        # would silently override this more specific location unconditionally.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options   "nosniff"       always;
        add_header X-Frame-Options          "SAMEORIGIN"    always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin" always;
        # HSTS — enforces HTTPS for 1 year; remove preload until cert is public-CA-signed
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP — unsafe-inline retained for SPA compatibility; tighten after frontend audit
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://unpkg.com; connect-src 'self'; frame-ancestors 'none'; form-action 'self';" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        # ── API — /api/ prefix (patient portal + external callers) ───────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            set $backend http://backend:8000;
            proxy_pass         $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── API — direct routes (SynbotUI calls these without /api/ prefix) ─
        location ~ ^/(token|auth|refresh|logout|users|chat|health|docs|openapi\.json|redoc|dashboard|inventory|staff|timesheets|analytics|intelligence|reports|workflow|audit|stock|hr|ops|crm|procurement|webhook|sop|compliance|maintenance|projects|orders|calendar|kg|agents|eos|lab|pharmacy|wards|appointments|patients|billing|theatre|nursing|queue|finance|notifications|portal|payments|coverage|knowledge|forms|documents|schema|realtime|iot|twin|capability|capabilities|reconciliation|custody|risk|frontdesk|consent|integrations|hope|salary|shifts|quality|radiology|mch|telemedicine|operational|roles|departments|register|sage|imports|threads|events|submit_lead|submit_order|admin|controls|suppliers|tasks|cache|hospital-reports|specialist|clinical|facility) {
            limit_req zone=api burst=50 nodelay;
            set $backend http://backend:8000;
            proxy_pass         $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Patient Portal PWA (/portal) ───────────────────────────────────
        location /portal {
            limit_req zone=portal burst=20 nodelay;
            alias /usr/share/nginx/portal;
            try_files $uri $uri/ /portal/index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Patient portal API proxy (same backend, separate rate limit)
        location /portal/api/ {
            limit_req zone=portal burst=20 nodelay;
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Staff HMS Dashboard (SPA) — proxy to frontend container ──────────
        # Static assets have content-hashed filenames — cache aggressively
        location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            set $frontend http://frontend:8080;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # index.html — never cache so new deployments are picked up immediately.
        # Matches both the literal path AND root "/" — a normal browser visit
        # requests "/", not "/index.html" directly, and without this second
        # exact-match block it fell through to the uncached-but-unheadered
        # catch-all below, letting browsers cache a stale index.html
        # indefinitely (heuristic caching, no explicit directive either way)
        # and keep pointing at an old, no-longer-served JS bundle hash.
        location = /index.html {
            set $frontend http://frontend:8080;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }

        location = / {
            set $frontend http://frontend:8080;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header Cache-Control "no-cache, must-revalidate";
            expires 0;
        }

        # SPA catch-all — the frontend's own nginx handles try_files fallback
        location / {
            set $frontend http://frontend:8080;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
