# ─── Royan Hospital — On-Premise Deployment ──────────────────────────────────
# Run:  docker compose up -d
# Stop: docker compose down
# Logs: docker compose logs -f backend

services:

  # ── Redis Shared Cache ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: royan_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - royan_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: royan_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8000
      # Explicit DATABASE_URL using the Docker service name — overrides any
      # stale localhost URL that may exist in .env from a previous project.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-royan}:${POSTGRES_PASSWORD:-royan_secure_pass}@db:5432/${POSTGRES_DB:-royan_hospital}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      # Cache HuggingFace models inside the persisted backend_data volume so
      # they are not re-downloaded on every container restart.
      - HF_HOME=/app/data/hf_cache
    volumes:
      - backend_data:/app/data
      - backend_static:/app/static
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  # ── PostgreSQL + pgvector (official pre-built image — no compilation needed) ─
  db:
    image: pgvector/pgvector:pg17
    container_name: royan_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-royan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royan_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-royan_hospital}
    ports:
      # Expose DB to localhost only so ETL scripts and psql can connect directly
      # Port 5432 is taken by the host's native PostgreSQL; use 5433 instead.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - royan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-royan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SynbotUI (HMS Staff Dashboard) ───────────────────────────────────────
  frontend:
    build:
      context: ../SynbotUI
      dockerfile: Dockerfile
      target: static
    container_name: royan_frontend
    restart: unless-stopped
    networks:
      - royan_net

  # ── Patient Portal PWA ────────────────────────────────────────────────────
  patient_portal:
    build:
      context: ../patient-portal
      dockerfile: Dockerfile
    container_name: royan_portal
    restart: unless-stopped
    volumes:
      - portal_dist:/usr/share/nginx/portal
    networks:
      - royan_net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: cgr.dev/chainguard/nginx:latest
    user: root
    container_name: royan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
      - portal_dist:/usr/share/nginx/portal:ro
    networks:
      - royan_net
    depends_on:
      certs-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      frontend:
        condition: service_started
      patient_portal:
        condition: service_started

  # ── TLS Certificate Init (one-shot) ──────────────────────────────────────
  certs-init:
    image: alpine:3.19
    volumes:
      - nginx_ssl:/ssl
    command:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache openssl &&
        mkdir -p /ssl &&
        ([ -f /ssl/cert.pem ] && echo "cert exists, skipping" ||
        openssl req -x509 -nodes -newkey rsa:2048
        -keyout /ssl/key.pem -out /ssl/cert.pem -days 365
        -subj "/C=NG/ST=Lagos/L=Lagos/O=Royan Hospital/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1")
    restart: "no"

  # ── Docker Socket Proxy (read-only, log-tail watcher's only path to the
  # Docker API) ──────────────────────────────────────────────────────────────
  # Only this container touches the real Docker socket. CONTAINERS/LOGS/EVENTS
  # allow listing containers, streaming logs, and watching events; POST=0
  # blocks every mutating call (create/exec/etc.) regardless of anything else
  # being misconfigured — this is what keeps a bug in the watcher script from
  # ever becoming a host-level RCE.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: royan_docker_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      LOGS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - royan_logwatch_net

  # ── Log-Tail Watcher ──────────────────────────────────────────────────────
  # Reads backend/nginx/db logs via the socket proxy above, normalizes and
  # PHI-scrubs recurring errors, and posts them to the backend's internal
  # /internal/reliability/log-signal endpoint — feeding the existing
  # capability-discovery proposal queue instead of a separate system.
  log_watcher:
    build:
      context: ./log-watcher
      dockerfile: Dockerfile
    container_name: royan_log_watcher
    restart: unless-stopped
    environment:
      DOCKER_PROXY_URL: tcp://docker-socket-proxy:2375
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_SIGNAL_KEY: ${INTERNAL_SIGNAL_KEY:-}
    networks:
      - royan_net
      - royan_logwatch_net
    depends_on:
      - docker-socket-proxy
      - backend

  # ── GlitchTip (self-hosted, Sentry-compatible error tracker) ─────────────
  # Secondary detection layer: catches genuinely uncaught Python exceptions
  # (import-time crashes, unhandled route errors). The log-tail watcher above
  # remains the primary layer — local_db.py swallows select-path errors, so
  # they never reach an exception tracker. SERVER_ROLE=all_in_one runs web +
  # Celery worker + beat in one container and migrates on boot.
  # UI: http://localhost:8090 (loopback only — not exposed to the network).
  glitchtip:
    image: glitchtip/glitchtip:6.2
    container_name: royan_glitchtip
    restart: unless-stopped
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-royan_secure_pass}@db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8090
      DEFAULT_FROM_EMAIL: glitchtip@royanhospital.local
      ENABLE_OPEN_USER_REGISTRATION: "False"
      CELERY_WORKER_AUTOSCALE: "1,2"
      PORT: 8080
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
      glitchtip-db-init:
        condition: service_completed_successfully

  # One-shot: creates the "glitchtip" database on the shared Postgres if it
  # doesn't exist yet. Postgres's docker-entrypoint-initdb.d only runs on a
  # brand-new volume, so an already-initialized server (like the client's)
  # never gets the database any other way — this makes deploys self-contained.
  glitchtip-db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-royan_secure_pass}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h db -U ${POSTGRES_USER:-postgres} -d postgres -tc
        "SELECT 1 FROM pg_database WHERE datname='glitchtip'" | grep -q 1 &&
        echo "glitchtip db exists, skipping" ||
        psql -h db -U ${POSTGRES_USER:-postgres} -d postgres -c "CREATE DATABASE glitchtip"
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Dedicated broker for GlitchTip's Celery queue. Deliberately NOT the shared
  # royan_redis: that one runs allkeys-lru (cache semantics — evicts anything
  # under memory pressure), which silently drops queued Celery tasks.
  glitchtip-redis:
    image: redis:7-alpine
    container_name: royan_glitchtip_redis
    restart: unless-stopped
    command: redis-server --save ""
    networks:
      - royan_net

  # ── Daily Backup Job ──────────────────────────────────────────────────────
  backup:
    image: postgres:18-alpine
    container_name: royan_backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-royan_secure_pass}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
    # Run backup every day at 02:00; container stays up via cron
    entrypoint: ["/bin/sh", "-c", "crond -f -d 8 & tail -f /dev/null"]
    command: []
    # Inject crontab on startup
    configs:
      - source: backup_cron
        target: /var/spool/cron/crontabs/root

configs:
  backup_cron:
    content: "0 2 * * * /backup.sh >> /backups/backup.log 2>&1\n"

volumes:
  pg_data:
  backend_data:
  backend_static:
  portal_dist:
  backup_data:
  nginx_ssl:
  glitchtip_uploads:

networks:
  royan_net:
    driver: bridge
  # Isolated network for the docker-socket-proxy: only log_watcher joins both
  # this and royan_net, so no other container (frontend, patient_portal, db)
  # can ever reach the proxy even if compromised.
  royan_logwatch_net:
    driver: bridge
