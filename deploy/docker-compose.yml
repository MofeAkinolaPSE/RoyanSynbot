# ─── Royan Hospital — On-Premise Deployment ──────────────────────────────────
# Run:  docker compose up -d
# Stop: docker compose down
# Logs: docker compose logs -f backend

services:

  # ── Redis Shared Cache ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: royan_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - royan_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: royan_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8000
      # Explicit DATABASE_URL using the Docker service name — overrides any
      # stale localhost URL that may exist in .env from a previous project.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-royan}:${POSTGRES_PASSWORD:-royan_secure_pass}@db:5432/${POSTGRES_DB:-royan_hospital}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      # Cache HuggingFace models inside the persisted backend_data volume so
      # they are not re-downloaded on every container restart.
      - HF_HOME=/app/data/hf_cache
    volumes:
      - backend_data:/app/data
      - backend_static:/app/static
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  # ── PostgreSQL + pgvector (official pre-built image — no compilation needed) ─
  db:
    image: pgvector/pgvector:pg17
    container_name: royan_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-royan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-royan_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-royan_hospital}
    ports:
      # Expose DB to localhost only so ETL scripts and psql can connect directly
      # Port 5432 is taken by the host's native PostgreSQL; use 5433 instead.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - royan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-royan}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SynbotUI (HMS Staff Dashboard) ───────────────────────────────────────
  frontend:
    build:
      context: ../SynbotUI
      dockerfile: Dockerfile
      target: static
    container_name: royan_frontend
    restart: unless-stopped
    networks:
      - royan_net

  # ── Patient Portal PWA ────────────────────────────────────────────────────
  patient_portal:
    build:
      context: ../patient-portal
      dockerfile: Dockerfile
    container_name: royan_portal
    restart: unless-stopped
    volumes:
      - portal_dist:/usr/share/nginx/portal
    networks:
      - royan_net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: cgr.dev/chainguard/nginx:latest
    user: root
    container_name: royan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
      - portal_dist:/usr/share/nginx/portal:ro
    networks:
      - royan_net
    depends_on:
      certs-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      frontend:
        condition: service_started
      patient_portal:
        condition: service_started

  # ── TLS Certificate Init (one-shot) ──────────────────────────────────────
  certs-init:
    image: alpine:3.19
    volumes:
      - nginx_ssl:/ssl
    command:
      - /bin/sh
      - -c
      - >-
        apk add --no-cache openssl &&
        mkdir -p /ssl &&
        ([ -f /ssl/cert.pem ] && echo "cert exists, skipping" ||
        openssl req -x509 -nodes -newkey rsa:2048
        -keyout /ssl/key.pem -out /ssl/cert.pem -days 365
        -subj "/C=NG/ST=Lagos/L=Lagos/O=Royan Hospital/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1")
    restart: "no"

  # ── Daily Backup Job ──────────────────────────────────────────────────────
  backup:
    image: postgres:18-alpine
    container_name: royan_backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-royan_secure_pass}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - royan_net
    depends_on:
      db:
        condition: service_healthy
    # Run backup every day at 02:00; container stays up via cron
    entrypoint: ["/bin/sh", "-c", "crond -f -d 8 & tail -f /dev/null"]
    command: []
    # Inject crontab on startup
    configs:
      - source: backup_cron
        target: /var/spool/cron/crontabs/root

configs:
  backup_cron:
    content: "0 2 * * * /backup.sh >> /backups/backup.log 2>&1\n"

volumes:
  pg_data:
  backend_data:
  backend_static:
  portal_dist:
  backup_data:
  nginx_ssl:

networks:
  royan_net:
    driver: bridge
